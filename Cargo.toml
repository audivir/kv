[package]
name = "kv"
version = "0.3.6"
edition = "2024"
description = "An image viewer for the Kitty Terminal Graphics Protocol"

[dependencies]
anyhow = "1.0"
atty = "0.2"
base64 = "0.23"
bat = {
  version = "0.26.1",
  default-features = false,
  features = [
    "regex-onig",
  ]
}
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6.0.0"
flate2 = "1.1"
image = { version = "0.25", features = ["default"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
shell-words = "1.1"
tempfile = "3.27.0"
toml = "1.1"

# heic
libheif-rs = {
  version = "3.0",
  default-features = false,
  features = [
    "image",
    "v1_17",
  ]
}

anydoc = "0.2"
env_logger = {
  version = "0.11.11",
  default-features = false,
  features = [
    "auto-color",
  ]
}
# html
headless_chrome = { version = "1.0" }
hex = { version = "0.4" }
log = "0.4.34"
# pdf
pdfium-render = { version = "0.9" }
# svg
resvg = { version = "0.48" }
serde_json = "1"
# office
sha2 = { version = "0.11.0" }
tar = "0.4"
tiny-skia = { version = "0.12" }
usvg = { version = "0.48" }
zip = { version = "8", default-features = false, features = ["deflate"] }

htmd = "0.5"
mime = "0.3"
# markdown
pulldown-cmark = "0.13"
pulldown-cmark-mdcat = "2"
syntect = { version = "5", default-features = false, features = ["parsing"] }
ureq = "3"
url = "2"

[dev-dependencies]
rstest = "0.26.1"

[profile.release]
debug = false
strip = true
lto = "fat"
codegen-units = 1

[package]
name = "kv"
version = "0.2.7"
edition = "2024"
description = "A image viewer for the Kitty Terminal Graphics Protocol"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", features = ["default"] }
bat = { version = "0.26.1", default-features = false, features = [
  "regex-onig",
] }
flate2 = "1.1"
base64 = "0.23"
crossterm = "0.29"
directories = "6.0.0"
anyhow = "1.0"
atty = "0.2"
tempfile = "3.27.0"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
shell-words = "1.1"

# heic
libheif-rs = { version = "3.0", default-features = false, features = [
  "v1_17",
  "image",
] }

# svg
resvg = { version = "0.48" }
usvg = { version = "0.48" }
tiny-skia = { version = "0.12" }
# pdf
pdfium-render = { version = "0.9" }
# html
headless_chrome = { version = "1.0", features = ["fetch"] }
# office
sha2 = { version = "0.11.0" }
hex = { version = "0.4" }

[dev-dependencies]
rstest = "0.26.1"

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
